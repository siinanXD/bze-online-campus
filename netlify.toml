# Netlify-Konfiguration. Fuer den Container-Weg (Railway) irrelevant.
# Das offizielle Next.js-Runtime-Plugin wird von Netlify automatisch installiert;
# es uebersetzt Server Components, Server Actions und die Middleware in Functions.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.7.0"
  NEXT_TELEMETRY_DISABLED = "1"

# Vorschau-Deploys sollen nicht in Suchmaschinen landen.
[context.deploy-preview]
  [context.deploy-preview.environment]
    NEXT_PUBLIC_ROBOTS = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Der Service Worker darf nie aus dem CDN-Cache kommen, sonst bleibt eine alte
# Version aktiv und die App aktualisiert sich beim Nutzer nicht mehr.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
