<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline — BZE Online Campus</title>
  <meta name="theme-color" content="#4039d1" />
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --border: #dcdfe6;
      --fg: #171d2b;
      --muted: #5b6472;
      --accent: #4039d1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10131c;
        --surface: #171b26;
        --border: #2d3444;
        --fg: #e8ebf2;
        --muted: #99a2b3;
        --accent: #7a74ea;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-text-size-adjust: 100%;
    }
    main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.2rem;
      padding: 2rem 1.5rem;
      max-width: 26rem;
      width: 100%;
      text-align: center;
    }
    .symbol {
      font-size: 2.75rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); font-size: 1rem; line-height: 1.5; margin: 0 0 1.5rem; }
    button {
      min-height: 48px;
      min-width: 48px;
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 0.9rem;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol" role="img" aria-label="Offline">📴</div>
    <h1>Du bist offline</h1>
    <p>
      Diese Seite ist ohne Internetverbindung gerade nicht verfügbar.
      Bereits geöffnete Bereiche und deine gespeicherten Eingaben bleiben nutzbar.
      Sobald du wieder online bist, werden deine Antworten übertragen.
    </p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
