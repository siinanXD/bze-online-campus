# Entwicklungsrichtlinie fuer bze-online-campus
#
# Die verbindliche Fassung steht unter C:\Dev\AI\Policies.
# Diese Datei aktiviert sie fuer dieses Projekt und haelt Abweichungen fest.

version: 1

policies:
  reuse_before_build:
    status: required
    source: C:\Dev\AI-Workspace\shared-rules\reuse-before-build.md
  research_before_production_code:
    status: required
    source: C:\Dev\AI-Workspace\shared-rules\research-policy.md
  license_review:
    status: required
    source: C:\Dev\AI-Workspace\shared-rules\license-policy.md
  security_review:
    status: required
    source: C:\Dev\AI-Workspace\shared-rules\security-policy.md
  development:
    status: required
    source: C:\Dev\AI-Workspace\shared-rules\development-policy.md

project_specific_rules: 
  - pnpm, nicht npm.
  - supabase/migrations/ wird von Agenten nicht geaendert.
  - Lerninhalte sind pruefungsrelevant — Struktur ja, Aussagen nein.
  - Neue Texte nach messages/, nicht fest ins Bauteil.
  - Keine urheberrechtlich geschuetzten Pruefungsfragen uebernehmen.

deviations: []
  # Abweichungen von den globalen Policies. Jede mit Grund und Datum.
  # Eine Abweichung ohne Grund ist ein Fehler, kein Sonderfall.
