project_id = "bze-online-campus"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# pgvector ist Teil des Postgres-Images ab 15; Migration 0001 legt die Extension an.
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Fängt ausgehende Mails lokal ab (Einladungen, Passwort-Reset).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/de"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Zugänge legt die Verwaltung an (Spec §6.2.1) — keine Selbstregistrierung.
enable_signup = false

[auth.email]
# Der Login nutzt intern <benutzername>@campus.bze + Passwort.
# Die globale Registrierung bleibt ueber [auth].enable_signup=false deaktiviert,
# der E-Mail/Passwort-Provider muss fuer bestehende Nutzer aber aktiv bleiben.
enable_signup = true
double_confirm_changes = true
# Lokal keine Mailbestätigung, damit Seed-Nutzer sofort einsatzfähig sind.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
