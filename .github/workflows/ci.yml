name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
  doku-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Migrationen erfordern DATENMODELL.md
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          [ -z "$BASE" ] && exit 0
          CH=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CH" | grep -q '^supabase/migrations/' && ! echo "$CH" | grep -q '^docs/DATENMODELL.md'; then
            echo "Migration geändert, aber docs/DATENMODELL.md nicht. Gate rot."; exit 1; fi
