name: CI
on: [push, pull_request]

jobs:
  build:
    name: Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit (packages/core) und Integration. E2E laeuft nicht hier —
      # dafuer braucht es eine laufende Anwendung (E2E_BASE_URL).
      - run: pnpm test

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.7.0
      - run: ruff check scripts
      - run: ruff format --check scripts

  dateigroesse:
    name: Dateigröße (Lesbarkeit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neue Domain- und Bibliotheksdateien bleiben klein
        # Gilt nur fuer packages/core: die Domaenenlogik soll in lesbaren
        # Einheiten bleiben. UI-Bildschirme sind bewusst ausgenommen.
        # 240 Zeilen fasst eine zusammenhaengende Einheit, faellt aber auf,
        # wenn mehrere Belange in einer Datei landen.
        run: |
          GRENZE=240
          FEHLER=0
          while IFS= read -r datei; do
            [ -z "$datei" ] && continue
            ZEILEN=$(wc -l < "$datei")
            if [ "$ZEILEN" -gt "$GRENZE" ]; then
              echo "ZU LANG  $datei ($ZEILEN Zeilen, max $GRENZE)"
              FEHLER=1
            fi
          done < <(find packages/core -name '*.ts' -not -name '*.test.ts')
          if [ "$FEHLER" -eq 1 ]; then
            echo "Domaindateien über $GRENZE Zeilen sollten aufgeteilt werden."
            exit 1
          fi
          echo "OK — alle Domaindateien unter $GRENZE Zeilen."

  doku-gate:
    name: Migration erfordert DATENMODELL.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Migrationen erfordern DATENMODELL.md
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          [ -z "$BASE" ] && exit 0
          CH=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CH" | grep -q '^supabase/migrations/' && ! echo "$CH" | grep -q '^docs/DATENMODELL.md'; then
            echo "Migration geändert, aber docs/DATENMODELL.md nicht. Gate rot."; exit 1; fi
